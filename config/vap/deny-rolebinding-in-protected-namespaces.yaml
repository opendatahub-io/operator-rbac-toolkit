# deny-rolebinding-in-protected-namespaces.yaml
#
# PURPOSE: Blocks creation of toolkit-managed RoleBindings in sensitive system
# namespaces. The deny-list covers kube-system, kube-public, kube-node-lease,
# default, and any namespace prefixed with "openshift-". This is a
# defense-in-depth measure to prevent the scoping controller from placing
# managed RoleBindings in namespaces that host critical cluster infrastructure.
#
# SCOPE: This policy only matches RoleBindings that carry the
# operator-rbac-toolkit.io/scoped-access-owners annotation. RoleBindings
# created by admins, Helm, OLM, or any other principal without the managed
# annotation are not affected.
#
# CUSTOMIZATION: Add or remove namespace names in the CEL list, or adjust the
# startsWith prefix to match your cluster's protected namespace convention.

apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: deny-rolebinding-in-protected-namespaces
  labels:
    operator-rbac-toolkit.io/policy: "deny-rolebinding-in-protected-namespaces"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["rolebindings"]
  # Only evaluate this policy for RoleBindings managed by the scoping controller.
  # This prevents blocking legitimate admin/Helm/OLM RoleBinding creation in
  # system namespaces.
  matchConditions:
    - name: has-managed-annotation
      expression: >-
        has(object.metadata.annotations) &&
        'operator-rbac-toolkit.io/scoped-access-owners' in object.metadata.annotations
  validations:
    # Deny if the target namespace is in the protected list or starts with
    # "openshift-". The namespace is taken from the object metadata since
    # RoleBindings are namespace-scoped resources.
    - expression: >-
        !(object.metadata.namespace in [
          "kube-system",
          "kube-public",
          "kube-node-lease",
          "default",
          "REPLACE_ME_CONTROLLER_NAMESPACE"
        ]) &&
        !object.metadata.namespace.startsWith("openshift-")
      message: >-
        RoleBindings cannot be created in protected namespaces: kube-system,
        kube-public, kube-node-lease, default, REPLACE_ME_CONTROLLER_NAMESPACE,
        or any namespace starting with "openshift-". These namespaces are
        reserved for system components.

---

apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: deny-rolebinding-in-protected-namespaces
  labels:
    operator-rbac-toolkit.io/policy: "deny-rolebinding-in-protected-namespaces"
spec:
  policyName: deny-rolebinding-in-protected-namespaces
  validationActions: [Deny]
